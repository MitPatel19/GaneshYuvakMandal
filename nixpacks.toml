# Build plan for Railway (Nixpacks).
# Node 22 is pinned so the prebuilt better-sqlite3 binary is always used.
# python3/gcc/make are included only as a fallback, in case the prebuilt
# binary is ever unavailable and the package has to be compiled.
[phases.setup]
nixPkgs = ["nodejs_22", "python3", "gcc", "gnumake"]
